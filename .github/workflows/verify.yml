name: Verify

on:
  pull_request:
  workflow_dispatch:

jobs:
  typecheck-lint-test:
    # macOS like the build smoke: the install rebuilds native modules for Electron and the tests load some of them.
    runs-on: macos-latest
    strategy:
      matrix:
        # The oldest Node the project supports (better-sqlite3 needs 22.12) and the newest.
        node: [22, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # Warnings are capped in the script (`--max-warnings`): the count may go down, never up.
      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test
